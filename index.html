<html>
    <head>
        <link rel="stylesheet" href="framer.css">

        <meta charset="utf-8">
        <title>Framer</title>
        <meta name="description" content="Site simples que adiciona uma moldura a uma imagem">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#FA0404">

        <meta property="og:url" content="https://www.chasecarnaroli.com/framer/">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Framer">
        <meta property="og:description" content="Site simples que adiciona uma moldura a uma imagem">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-RQDWEDSSSD"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-RQDWEDSSSD');
        </script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.css" integrity="sha512-w+u2vZqMNUVngx+0GVZYM21Qm093kAexjueWOv9e9nIeYJb1iEfiHC7Y+VvmP/tviQyA5IR32mwN/5hTEJx6Ng==" crossorigin="anonymous" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.9/cropper.min.js" integrity="sha512-9pGiHYK23sqK5Zm0oF45sNBAX/JqbZEP7bSDHyt+nT3GddF+VFIcYNqREt0GDpmFVZI3LZ17Zu9nMMc9iktkCw==" crossorigin="anonymous"></script>

        <script src="./framer.js" defer></script>
    </head>
    <body>
        <div id="navbar">
            <img id="logo" src="assets/logo.png" alt="Lula 13 Presidente">
            <h1>Vira voto</h1>
        </div>
        <div id="content">
            <div class="instructions">
                <div class="step-label" data-step="1"><span class="step-num">1</span> Escolha um modelo</div>
                <div class="step-label" data-step="2"><span class="step-num">2</span> Envie uma foto</div>
                <div class="step-label" data-step="3"><span class="step-num">3</span> Recorte sua imagem</div>
                <div class="step-label" data-step="4"><span class="step-num">4</span> Baixar</div>
            </div>

            <section id="step-1" class="wizard-step">
                <h2>Selecione um modelo</h2>
                <div id="templates" class="templates"></div>
                <div class="actions">
                    <button type="button" id="next-template-btn" disabled>Próximo</button>
                </div>
            </section>

            <section id="step-2" class="wizard-step" hidden>
                <h2>Envie sua foto</h2>
                <p class="chosen-template">Moldura: <strong id="chosen-template-name">—</strong></p>
                <label id="dropzone" for="photo-input">
                    <svg class="dropzone-star" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 1.5l2.93 7.04 7.6.61-5.79 4.96 1.77 7.39L12 17.5l-6.51 3.99 1.77-7.39L1.47 9.15l7.6-.61z"/>
                    </svg>
                    <span id="dropzone-title" class="dropzone-title">Arraste sua foto aqui</span>
                    <img id="photo-preview" alt="Pré-visualização da foto selecionada" hidden>
                    <span id="dropzone-cta" class="dropzone-cta">Selecionar foto</span>
                    <span class="dropzone-sub">JPG, PNG ou WEBP — fotos quadradas funcionam melhor</span>
                    <input id="photo-input" type="file" accept="image/*" />
                </label>
                <p id="photo-name" class="photo-name">Nenhuma foto selecionada</p>
                <div class="actions">
                    <button type="button" id="back-photo-btn" class="secondary">Voltar</button>
                    <button type="button" id="next-photo-btn" disabled>Próximo</button>
                </div>
            </section>

            <section id="step-3" class="wizard-step" hidden>
                <h2>Recorte sua foto</h2>
                <p class="hint">Arraste e redimensione a caixa para que a parte desejada fique dentro da moldura.</p>
                <div class="frame-maker">
                    <div id="crop-container">
                        <img id="profile-pic" src="" alt="Foto para recortar">
                    </div>
                </div>
                <div class="actions">
                    <button type="button" id="back-crop-btn" class="secondary">Voltar</button>
                    <button type="button" id="finish-btn">Concluir</button>
                </div>
            </section>

            <section id="step-4" class="wizard-step" hidden>
                <h2>Sua foto com moldura</h2>
                <canvas id="framed"></canvas>
                <div class="actions">
                    <button type="button" id="back-finish-btn" class="secondary">Voltar</button>
                    <button type="button" id="restart-btn" class="secondary">Recomeçar</button>
                    <a id="download-btn" class="button-link" download="vira-voto.png">Baixar</a>
                </div>
            </section>
        </div>
    </body>
</html>
